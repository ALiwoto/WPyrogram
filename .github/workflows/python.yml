name: Build and test wheels

# macos targets are removed because github is low on macos
# we may enable it later if we explicitly need it

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Set package version from Git tags
        shell: python
        run: |
          import os
          import re
          import subprocess
          from pathlib import Path

          version_pattern = r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              tag = os.environ["GITHUB_REF_NAME"]
              if not re.fullmatch(version_pattern, tag):
                  raise ValueError(f"Expected a vMAJOR.MINOR.PATCH release tag, got {tag!r}")
              subprocess.run(["git", "merge-base", "--is-ancestor", "HEAD", "origin/master"], check=True)
          else:
              tags = subprocess.check_output(
                  ["git", "tag", "--list", "v*", "--sort=-version:refname"],
                  text=True,
              ).splitlines()
              tag = next(tag for tag in tags if re.fullmatch(version_pattern, tag))

          version = tag[1:]
          path = Path("pyrogram/__init__.py")
          source, count = re.subn(
              r'^__version__ = "[^"]+"$',
              f'__version__ = "{version}"',
              path.read_text(encoding="utf-8"),
              flags=re.MULTILINE,
          )
          if count != 1:
              raise ValueError("Expected exactly one __version__ assignment")
          path.write_text(source, encoding="utf-8")
          print(f"Package version: {version}")
      - run: python -m pip install build==1.6.1 twine==7.0.0
      - run: python -m build --sdist
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    needs: sdist
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - run: python -m pip install cibuildwheel==4.3.4
      - name: Build platform wheels from the source distribution
        shell: bash
        run: python -m cibuildwheel dist/*.tar.gz --output-dir wheelhouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  test:
    if: github.ref_type != 'tag'
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse
      - name: Install the built wheel and test tools
        shell: bash
        run: |
          python -m pip install wheelhouse/*.whl
          python -m pip install -r dev-requirements.txt
      - name: Test the installed package
        working-directory: ${{ runner.temp }}
        run: python -m pytest --import-mode=importlib "${{ github.workspace }}/tests"
